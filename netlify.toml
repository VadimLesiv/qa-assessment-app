[build]
  command = "npm install && npm run build --workspace @qa/shared && npm run build --workspace @qa/web"
  publish = "apps/web/dist"

# Same-origin proxy to the Render API, so the browser never makes a
# cross-origin request and apps/web/src/lib/api.ts needs no changes.
[[redirects]]
  from = "/api/*"
  to = "https://qa-assessment-api.onrender.com/api/:splat"
  status = 200
  force = true

# Client-side routing (react-router) - let the SPA handle unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
